name: CI - Automatizacion de pruebas

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    name: Compilar y ejecutar pruebas
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilar y ejecutar pruebas
        run: mvn --batch-mode clean test

      - name: Generar resumen del pipeline
        if: always()
        run: |
          python - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          import os

          total = fallidas = errores = omitidas = 0

          for archivo in glob.glob("target/surefire-reports/TEST-*.xml"):
              raiz = ET.parse(archivo).getroot()
              total += int(raiz.attrib.get("tests", 0))
              fallidas += int(raiz.attrib.get("failures", 0))
              errores += int(raiz.attrib.get("errors", 0))
              omitidas += int(raiz.attrib.get("skipped", 0))

          aprobadas = total - fallidas - errores - omitidas

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as resumen:
              resumen.write("# Dashboard de pruebas\\n\\n")
              resumen.write("## Pruebas funcionales y BDD\\n")
              resumen.write(f"- Total: {total}\\n")
              resumen.write(f"- Aprobadas: {aprobadas}\\n")
              resumen.write(f"- Fallidas: {fallidas + errores}\\n")
              resumen.write(f"- Omitidas: {omitidas}\\n\\n")
              resumen.write("## Rendimiento - Simulación local JMeter\\n")
              resumen.write("- Solicitudes: 100\\n")
              resumen.write("- Latencia promedio: 1 ms\\n")
              resumen.write("- Throughput: 22.5 solicitudes/segundo\\n")
              resumen.write("- Errores: 0.00%\\n\\n")
              resumen.write("> Las métricas de JMeter corresponden a una prueba local de referencia, no a una ejecución del pipeline.\\n")
          PY

      - name: Publicar resultados de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas
          path: |
            target/surefire-reports/
            target/cucumber-reports/
          if-no-files-found: warn